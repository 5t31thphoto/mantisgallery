; Mantis Gallery — M5Stack Core2
; SD-card slideshow: /images (+ subfolders), random no-repeat shuffle

[env:m5stack-core2]
platform = espressif32
board = m5stack-core2
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = partitions.csv   ; no SPIFFS: saves 128 KB when installed by MantisCore
extra_scripts = enable_lto.py
lib_deps =
    m5stack/M5Unified@^0.2.2
    m5stack/M5GFX@^0.2.2
build_flags =
    -DCORE_DEBUG_LEVEL=0
    ; size: whole-program LTO + drop unused sections (same as MantisCore)
    -flto
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
