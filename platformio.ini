; Mantis Gallery — M5Stack Core2
; SD-card slideshow: /images (+ subfolders), random no-repeat shuffle

[env:m5stack-core2]
platform = espressif32@8.0.0   ; pinned to the last known-green build; bump deliberately
board = m5stack-core2
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = partitions.csv   ; no SPIFFS: saves 128 KB when installed by MantisCore
lib_deps =
    m5stack/M5Unified@^0.2.2
    m5stack/M5GFX@^0.2.2
build_flags =
    -DCORE_DEBUG_LEVEL=0
    ; size: drop unused sections. (Whole-program LTO removed: on Xtensa it merges the whole
    ; Arduino core + M5 libs into one blob whose literal pool lands >256 KB from the code,
    ; causing thousands of "dangerous relocation: l32r: literal target out of range" link errors.)
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
    ; On by default; add a flag to turn one off:
    ;   -DMG_NO_IRAM_HOT  keep the per-pixel render loops in flash, not IRAM (they take ~15 KB of IRAM)
    ;   -DMG_LCD_40MHZ    never try the display at 80 MHz (stay at 40, M5GFX's Core2 default)
